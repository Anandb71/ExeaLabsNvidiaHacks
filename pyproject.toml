[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arrival-sim"
version = "0.1.0"
description = "Arrival: one room scan -> digital twin -> MuJoCo-simulated LeRobot v2 demos for GR00T (arm, people, closed-loop eval; a scripted placeholder dataset is also available)."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pyarrow",
  "pyyaml",
  "pillow",
  "imageio",
  "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = ["pytest"]
sim = ["mujoco>=3.1"]
lint = ["ruff==0.17.1"]

[project.scripts]
arrival = "arrival.cli:main"

[tool.setuptools.packages.find]
include = ["arrival*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["render: probes OpenGL in a child process"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".claude", "ios", "out"]

[tool.ruff.lint]
# CI gate: only what is certainly a bug (syntax errors, undefined names, invalid comparisons).
# Unused imports and style are not enforced yet.
select = ["E9", "F63", "F7", "F82"]
